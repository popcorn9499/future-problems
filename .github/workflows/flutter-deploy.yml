name: Flutter Deploy Web

on:
  workflow_run:
    workflows:
      - Backend CI
      - Flutter CI
      - Flutter Integration Tests
      - Lint Markdown
    types:
      - completed
    branches:
      - master
      - dev

permissions:
  actions: read
  contents: read

jobs:
  ci-gate:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Check required CI workflows
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$HEAD_SHA&per_page=100")"
          ready=true

          for workflow in "Backend CI" "Flutter CI" "Flutter Integration Tests" "Lint Markdown"; do
            run="$(jq -c --arg name "$workflow" --arg branch "$HEAD_BRANCH" '[.workflow_runs[] | select(.name == $name and .head_branch == $branch)] | sort_by(.run_number, .run_attempt) | last // {}' <<< "$runs")"
            status="$(jq -r '.status // "missing"' <<< "$run")"
            conclusion="$(jq -r '.conclusion // "none"' <<< "$run")"

            if [[ "$status" != "completed" || "$conclusion" != "success" ]]; then
              echo "$workflow has not succeeded (status: $status, conclusion: $conclusion)"
              ready=false
            fi
          done

          echo "ready=$ready" >> "$GITHUB_OUTPUT"

  flutter-deploy:
    needs: ci-gate
    if: ${{ needs.ci-gate.outputs.ready == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Download project code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable

      - name: Install dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Build web release
        working-directory: frontend
        env:
          API_BASE_URL: ${{ github.event.workflow_run.head_branch == 'dev' && 'https://test.gobison.popicraft.net' || 'https://gobison.popicraft.net' }}
        run: flutter build web --release --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: frontend/build/web/
          if-no-files-found: error

      - name: Deploy to Webserver via Rsync
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          WEB_DEPLOY_PATH: ${{ github.event.workflow_run.head_branch == 'dev' && '/var/www/gobison-test/' || '/var/www/gobison/' }}
        run: |
          echo "$SSH_KEY" > private_key
          chmod 600 private_key
          trap 'rm -f private_key' EXIT
          rsync -avz -e "ssh -p2525 -i private_key -o StrictHostKeyChecking=no" frontend/build/web/ "deploybot@popicraft.net:$WEB_DEPLOY_PATH"