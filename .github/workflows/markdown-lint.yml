name: Lint Markdown

on:
  push:
  pull_request:

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run markdownlint-cli2
        uses: davidanson/markdownlint-cli2-action@v19
        with:
          globs: '**/*.md'